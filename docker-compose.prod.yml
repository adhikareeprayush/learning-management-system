# Production: Postgres + the app image built from the Dockerfile.
# Usage: fill in .env (see .env.example), then
#   docker compose -f docker-compose.prod.yml up -d --build
# First admin: set ADMIN_EMAIL / ADMIN_PASSWORD / ADMIN_NAME in .env for the
# first start (the entrypoint creates the account), then remove ADMIN_PASSWORD.
# Put a TLS-terminating reverse proxy in front of 127.0.0.1:3005.

services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: lms
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      # Public values are compiled into the client bundle and CSP; changing
      # them needs a rebuild (--build).
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
        NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT:-}
        IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    image: lms-web:latest
    container_name: lms-web
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3005:3005"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/lms
      DIRECT_URL: ""
      NODE_ENV: production
      PORT: "3005"

volumes:
  lms_pgdata:
