services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports:
      - "5435:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    image: lms-node:22
    container_name: lms-web
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lms
      BETTER_AUTH_SECRET: docker-dev-secret-change-me-32chars
      BETTER_AUTH_URL: http://localhost:3005
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      # Production-safe default; local demo scripts run pnpm db:seed explicitly.
      SEED_DATABASE_ON_START: "${SEED_DATABASE_ON_START:-false}"
      WATCHPACK_POLLING: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3005"
    volumes:
      - .:/app
    command:
      - bash
      - -lc
      - |
        set -e
        ./node_modules/.bin/prisma generate
        ./node_modules/.bin/next dev --hostname 0.0.0.0 --port 3005

volumes:
  lms_pgdata:
