services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms
    ports:
      - "5435:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Local inbox for testing emails: SMTP on :1025, web UI on http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: lms-mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # The production image (Dockerfile) wired to the db and mail services above:
  # `pnpm docker:web`, then http://localhost:3005 (stop `pnpm dev` first, both
  # use port 3005). Reads the rest of its config (BETTER_AUTH_SECRET, IMAGEKIT_*,
  # ADMIN_*) from .env; emails go to Mailpit at http://localhost:8025.
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3005
        NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: ${NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT:-}
        IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    image: lms-web:local
    container_name: lms-web
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "127.0.0.1:3005:3005"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lms
      # Blank so migrations can't follow a DIRECT_URL in .env to a remote database.
      DIRECT_URL: ""
      BETTER_AUTH_URL: http://localhost:3005
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: "Convolution LMS <no-reply@localhost>"
      # Demo data needs both: SEED_DATABASE_ON_START=true SEED_DEMO=true pnpm docker:web
      SEED_DATABASE_ON_START: ${SEED_DATABASE_ON_START:-false}
      SEED_DEMO: ${SEED_DEMO:-false}

volumes:
  lms_pgdata:
